# Signal v1.0 — referência self-hosted (web + research worker).
# Ollama e Postgres/Supabase podem permanecer fora deste Compose.
# Não inclui secrets. Copie .env.production.example → .env

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile.v1
    env_file:
      - .env
    ports:
      - "3000:3000"
    command: ["npm", "run", "start"]
    restart: unless-stopped

  research-worker:
    build:
      context: .
      dockerfile: Dockerfile.v1
    env_file:
      - .env
    command: ["npm", "run", "worker:research"]
    restart: unless-stopped
